<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel ="stylesheet" href ="styles.css">
  
  <title>Frontend Mentor | QR code component</title>
</head>
<body>
  <div class="container">
    <figure>
      <img src="./images/image-qr-code.png" alt="QR Code to Frontend Mentor" class="qr-code">
    </figure>
    <main>
      <h1 class="description">Improve your front-end skills by building projects</h1>
      <p class="instructions">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </main>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.fr
    ontendmentor.io/profile/DAVESPARK42">DAVESPARK42</a>.
  </footer>
</body>
</html>
